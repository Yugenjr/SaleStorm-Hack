version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: salestorm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salestorm}
      POSTGRES_USER: ${POSTGRES_USER:-salestorm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salestorm_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salestorm_user} -d ${POSTGRES_DB:-salestorm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  salestorm-app:
    build: .
    container_name: salestorm-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-salestorm}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-salestorm_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-salestorm_password}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
