version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: salestorm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salestorm}
      POSTGRES_USER: ${POSTGRES_USER:-salestorm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salestorm_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salestorm_user} -d ${POSTGRES_DB:-salestorm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  salestorm-app:
    build: .
    container_name: salestorm-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-salestorm}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-salestorm_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-salestorm_password}
      - APP_KAFKA_ENABLED=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - APP_REDIS_ENABLED=true
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.7.0
    container_name: salestorm-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  redis:
    image: redis:7-alpine
    container_name: salestorm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  kafka_data:
